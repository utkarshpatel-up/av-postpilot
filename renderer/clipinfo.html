<!doctype html>
<html><head><meta charset="utf-8"><title>Clip Info</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  :root { --bg:#16181d; --card:#1f2229; --line:#2c3039; --text:#e8eaed; --muted:#9aa0aa; --accent:#e8603c; }
  * { box-sizing:border-box; }
  ::-webkit-scrollbar { width:6px; } ::-webkit-scrollbar-thumb { background:#2c3039; border-radius:3px; }
  body { margin:0; background:var(--bg); color:var(--text); font:13px/1.45 "Segoe UI", system-ui, sans-serif; user-select:none; }
  header { -webkit-app-region:drag; display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid var(--line); background:var(--card); }
  header b { flex:1; font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
  #dot { width:8px; height:8px; border-radius:50%; background:#555; }
  button { -webkit-app-region:no-drag; background:none; border:0; color:var(--muted); font-size:16px; cursor:pointer; padding:0 4px; }
  button:hover { color:var(--text); }
  main { padding:10px 12px; }
  #name { font-size:14px; font-weight:600; word-break:break-all; margin-bottom:2px; display:flex; gap:6px; align-items:flex-start; }
  #swatch { flex:none; width:10px; height:10px; border-radius:2px; margin-top:5px; }
  #sub { color:var(--muted); font-size:12px; margin-bottom:8px; }
  .big { display:flex; gap:14px; margin:6px 0 10px; }
  .big div { flex:1; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  .big small { display:block; color:var(--muted); font-size:11px; }
  .big span { font:600 15px/1.3 Consolas, monospace; }
  table { width:100%; border-collapse:collapse; }
  td { padding:2px 0; vertical-align:top; }
  td:first-child { color:var(--muted); width:84px; }
  td:last-child { font-family:Consolas, monospace; font-size:12px; word-break:break-all; user-select:text; }
  #markers div { font-size:12px; }
  #more { display:block; width:100%; margin-top:8px; padding:4px; font-size:12px; color:var(--muted); border:1px solid var(--line); border-radius:5px; }
  #more:hover { color:var(--text); border-color:#444; }
  .empty { color:var(--muted); padding:30px 0; text-align:center; }
</style></head>
<body>
<header><span id="dot"></span><b>Clip Info</b><button id="close" title="Close">×</button></header>
<main id="main"><div class="empty">Waiting for DaVinci Resolve…</div></main>
<script>
const COLORS = { Orange:'#ff8c2a', Apricot:'#ffa86b', Yellow:'#e8c832', Lime:'#9fd13b', Olive:'#5f9e3a', Green:'#3ccf8e', Teal:'#2fb5a8', Navy:'#2b4f9e', Blue:'#4a90e2', Purple:'#8d5bd8', Violet:'#c06be0', Pink:'#ef6fae', Tan:'#c9a67a', Beige:'#d9c9a6', Brown:'#8a5a3b', Chocolate:'#6b3f26', Cyan:'#3ad0e0', Red:'#e54b4b', Cream:'#f5ecd0', Fuchsia:'#e03fbf', Lavender:'#b7a5e8', Mint:'#7ee0b5', Rose:'#f2879b', Sky:'#7fc4f0', Sand:'#d8bf8c' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const tc = (frames, fps) => { if (!fps) return String(frames); const f = Math.round(fps), s = Math.floor(frames / f); const p = n => String(n).padStart(2, '0'); return `${p(Math.floor(s / 3600))}:${p(Math.floor(s / 60) % 60)}:${p(s % 60)}:${p(frames % f)}`; };
const len = (frames, fps) => { if (!fps) return `${frames} fr`; const s = frames / fps; return s >= 60 ? `${Math.floor(s / 60)}m ${(s % 60).toFixed(1)}s` : `${s.toFixed(2)}s`; };
let last = '', expanded = false, lastInfo = null;
try { expanded = localStorage.getItem('clipinfo-more') === '1'; } catch {}
const fit = () => requestAnimationFrame(() => pilot.clipInfoHeight(document.querySelector('header').offsetHeight + document.getElementById('main').offsetHeight + 4));
document.getElementById('close').onclick = () => pilot.clipInfoToggle();
pilot.onClipInfo(r => { const key = JSON.stringify(r); if (key === last) return; last = key; lastInfo = r; render(r); fit(); });
function render(r) {
  const dot = document.getElementById('dot'), main = document.getElementById('main');
  dot.style.background = r.ok && r.connected ? '#3ccf8e' : '#e54b4b';
  if (!r.ok) { main.innerHTML = `<div class="empty">${esc(r.error)}</div>`; return; }
  if (!r.connected) { main.innerHTML = '<div class="empty">DaVinci Resolve is not running</div>'; return; }
  if (!r.timeline) { main.innerHTML = '<div class="empty">Open a timeline in Resolve</div>'; return; }
  const c = r.clip;
  if (!c) { main.innerHTML = `<div class="empty">No video clip at ${esc(r.timecode)}<br><small>${esc(r.timeline)}</small></div>`; return; }
  const fps = r.fps, file = c.file || '';
  const basic = [
    ['Timeline In', tc(c.start, fps)], ['Timeline Out', tc(c.start + c.duration, fps)],
    ['Resolution', c.resolution], ['Frame rate', c.clipFps ? `${c.clipFps} fps` : ''], ['Codec', c.codec],
  ].filter(([, v]) => v);
  const extra = [
    ['Source In', tc(c.sourceIn, fps)], ['Source Out', tc(c.sourceIn + c.duration, fps)],
    ['Source len', c.sourceDuration], ['Audio', c.audioCh ? `${c.audioCh} ch` : ''], ['Created', c.created],
    ['Fusion', c.fusion ? `${c.fusion} comp(s)` : ''], ['File', file],
  ].filter(([, v]) => v);
  const markers = (c.markers || []).sort((a, b) => a.frame - b.frame);
  main.innerHTML = `
    ${expanded ? `<div id="name">${esc(c.name)}</div>` : ''}
    <div id="sub"><span id="swatch" style="display:inline-block;margin:0 6px 0 0;vertical-align:-1px;background:${COLORS[c.color] || 'transparent'};border:${c.color ? 0 : '1px solid #555'}"></span>V${esc(c.track || '?')} · ${esc(r.timeline)}${c.enabled === false ? ' · disabled' : ''}</div>
    <div class="big"><div><small>Duration</small><span>${tc(c.duration, fps)}</span></div><div><small>Length</small><span>${len(c.duration, fps)}</span><small>${c.duration} frames</small></div></div>
    <table>${(expanded ? basic.concat(extra) : basic).map(([k, v]) => `<tr><td>${k}</td><td>${esc(v)}</td></tr>`).join('')}</table>
    ${expanded && markers.length ? `<div id="markers" style="margin-top:8px"><div style="color:var(--muted)">Markers (${markers.length})</div>${markers.map(m => `<div><span style="color:${COLORS[m.color] || '#aaa'}">●</span> ${tc(m.frame, fps)} ${esc(m.name)} ${esc(m.note)}</div>`).join('')}</div>` : ''}
    <button id="more">${expanded ? '− less' : `+ more${markers.length ? ` · ${markers.length} marker${markers.length > 1 ? 's' : ''}` : ''}`}</button>`;
  document.getElementById('more').onclick = () => { expanded = !expanded; try { localStorage.setItem('clipinfo-more', expanded ? '1' : '0'); } catch {} render(lastInfo); fit(); };
}
</script>
</body></html>
