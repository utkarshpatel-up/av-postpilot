name: Build macOS distributions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'tests/**'
      - 'renderer/**'
      - 'resolve-db-backup/**'
      - 'scripts/verify-mac-package.js'
      - 'package*.json'
      - '.github/workflows/build-mac.yml'
jobs:
  mac:
    runs-on: macos-14
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check native app startup and packaged Mac scripts
        run: node scripts/verify-mac-package.js
      - uses: actions/upload-artifact@v4
        with:
          name: AV-PostPilot-macOS
          path: dist/AV-PostPilot-*-macOS-*.dmg
          if-no-files-found: error
          # Download the build right after it finishes. Storage is billed for as
          # long as it's kept, and the free plan includes only 0.5 GB.
          retention-days: 7
