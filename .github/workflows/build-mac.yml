name: Build macOS distributions
on:
  workflow_dispatch:
  push:
    tags: ['v*']   # a release tag also attaches the DMGs to that release (path filters don't apply to tags)
    branches: [main]
    paths:
      - 'electron/**'
      - 'tests/**'
      - 'renderer/**'
      - 'resolve-db-backup/**'
      - 'scripts/verify-mac-package.js'
      - 'scripts/build-feedback-engine.js'
      - 'scripts/feedback-engine-*'
      - 'package*.json'
      - '.github/workflows/build-mac.yml'
jobs:
  mac:
    runs-on: macos-15
    permissions:
      contents: write   # to create the draft release / upload to the tag's release
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match package.json version
        if: github.ref_type == 'tag'
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${{ github.ref_name }}"
          [ "$tag" = "v$version" ] || { echo "Tag $tag does not match version $version"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The built-in audio engine, once per architecture: a frozen Python runs on its own only.
      # The x64 Python runs under Rosetta on this Apple silicon runner.
      - uses: actions/setup-python@v5
        id: python-arm64
        with:
          python-version: '3.14'
          architecture: arm64
      - uses: actions/setup-python@v5
        id: python-x64
        with:
          python-version: '3.14'
          architecture: x64
      - run: npm ci
      - name: Make sure Rosetta is installed
        run: softwareupdate --install-rosetta --agree-to-license
      - name: Build the audio engine (arm64)
        run: node scripts/build-feedback-engine.js --arch arm64
        env:
          FEEDBACK_ENGINE_PYTHON: ${{ steps.python-arm64.outputs.python-path }}
      - name: Build the audio engine (x64)
        run: node scripts/build-feedback-engine.js --arch x64
        env:
          FEEDBACK_ENGINE_PYTHON: ${{ steps.python-x64.outputs.python-path }}
      - run: npm test
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check native app startup and packaged Mac scripts
        run: node scripts/verify-mac-package.js
      # The DMGs go into a draft release (visible only to the repo's owner), not an
      # artifact: release files don't count against the account's artifact storage
      # quota, which 190 MB builds filled. Download into dist/, then delete the draft.
      - name: Put the DMGs in a draft release
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          ls dist/AV-PostPilot-*-macOS-*.dmg
          gh release create "mac-build-${{ github.run_number }}" dist/AV-PostPilot-*-macOS-*.dmg \
            --draft --target "$GITHUB_SHA" \
            --title "Mac build $version (${GITHUB_SHA::7})" \
            --notes "macOS DMGs of $version for dist/. Download, then delete this draft."
      # The Windows workflow creates the public release for the tag (electron-builder), so wait for it
      # instead of creating one here. Only the DMGs are added; Windows files and latest.yml are untouched.
      - name: Attach the DMGs to the release for this tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          ls dist/AV-PostPilot-*-macOS-*.dmg
          for i in $(seq 1 60); do
            gh release view "$tag" >/dev/null 2>&1 && break
            echo "Release $tag not created yet (attempt $i/60); waiting 30 s"
            sleep 30
          done
          gh release view "$tag" >/dev/null || { echo "Release $tag still missing after 30 min; is the Windows workflow ok? Re-run this job."; exit 1; }
          gh release upload "$tag" dist/AV-PostPilot-*-macOS-*.dmg --clobber
