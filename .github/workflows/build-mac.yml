name: Build macOS distributions
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'tests/**'
      - 'renderer/**'
      - 'resolve-db-backup/**'
      - 'scripts/verify-mac-package.js'
      - 'package*.json'
      - '.github/workflows/build-mac.yml'
jobs:
  mac:
    runs-on: macos-14
    permissions:
      contents: write   # to create the draft release holding the DMGs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check native app startup and packaged Mac scripts
        run: node scripts/verify-mac-package.js
      # The DMGs go into a draft release (visible only to the repo's owner), not an
      # artifact: release files don't count against the account's artifact storage
      # quota, which 190 MB builds filled. Download into dist/, then delete the draft.
      - name: Put the DMGs in a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          ls dist/AV-PostPilot-*-macOS-*.dmg
          gh release create "mac-build-${{ github.run_number }}" dist/AV-PostPilot-*-macOS-*.dmg \
            --draft --target "$GITHUB_SHA" \
            --title "Mac build $version (${GITHUB_SHA::7})" \
            --notes "macOS DMGs of $version for dist/. Download, then delete this draft."
